<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#e9f5ff">
  <title>Set semula kata laluan — Kawan CBT</title>
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#293f66}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 10% 14%,#ffe9d6,transparent 47%),radial-gradient(ellipse at 96% 80%,#e8ddff,transparent 45%),linear-gradient(130deg,#e5f7f4,#ebf5ff 62%,#fff1df)}
    .card{width:min(100%,510px);padding:clamp(24px,5vw,42px);background:rgba(255,255,255,.94);border:2px solid rgba(255,255,255,.95);border-radius:32px;box-shadow:0 25px 65px rgba(45,82,122,.12)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.brand img{width:76px;height:67px;object-fit:contain}.brand b{font-size:24px;letter-spacing:-1px}.brand small{display:block;color:#64809b;font-weight:600;font-size:13px}
    h1{font-size:clamp(25px,5vw,33px);line-height:1.22;margin:0 0 12px}p{line-height:1.7;color:#536e90;font-size:16px}.eyebrow{font-size:12px;font-weight:900;color:#28847b;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px}
    form{display:grid;gap:16px;margin-top:20px}label{display:grid;gap:7px;color:#25485f;font-size:14px;font-weight:800}input{height:53px;width:100%;border:1px solid #d1e2e8;border-radius:15px;padding:10px 14px;font-size:17px;color:#1f3d4c;background:#fff}input:focus{outline:3px solid #bdede1;border-color:#4da498}
    button{cursor:pointer;min-height:52px;border:0;border-radius:16px;background:linear-gradient(100deg,#399685,#318ab2);color:#fff;font-size:17px;font-weight:850;box-shadow:0 6px 0 #d0ebdd;padding:9px 18px}button:disabled{opacity:.6;cursor:progress}
    a{color:#227f8d;text-underline-offset:4px;font-weight:750}.message{min-height:30px;margin-top:20px;font-size:15px;font-weight:650;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.message[data-kind="danger"]{color:#a73244}.message[data-kind="success"]{color:#19794e}
    [hidden]{display:none!important}.bottom{margin-top:26px;font-size:14px}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><img src="wonderland-scene.svg" alt="" aria-hidden="true"><span><b>kawan<span style="color:#e98587">cbt</span></b><small>Ruang selamat, hati lebih tenang.</small></span></div>
    <div class="eyebrow">AKSES GURU KAUNSELING</div>
    <h1>Set semula kata laluan</h1>
    <p id="intro">Masukkan emel akaun GBK anda untuk menerima pautan menetapkan kata laluan baharu.</p>
    <form id="requestForm">
      <label for="email">Emel akaun GBK<input id="email" type="email" required autocomplete="email" placeholder="nama@contoh.com"></label>
      <button id="sendBtn" type="submit">Hantar pautan reset</button>
    </form>
    <form id="changeForm" hidden>
      <label for="newPassword">Kata laluan baharu (sekurang-kurangnya 12 aksara)<input id="newPassword" type="password" autocomplete="new-password" minlength="12" required></label>
      <label for="confirmPassword">Sahkan kata laluan<input id="confirmPassword" type="password" autocomplete="new-password" minlength="12" required></label>
      <button id="changeBtn" type="submit">Simpan kata laluan baharu</button>
    </form>
    <p id="message" class="message" role="status" aria-live="polite"></p>
    <p class="bottom"><a href="./">← Kembali ke Kawan CBT</a></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    (function () {
      "use strict";
      const byId = id => document.getElementById(id);
      const requestForm = byId("requestForm");
      const changeForm = byId("changeForm");
      const intro = byId("intro");
      const msg = byId("message");
      const config = window.KAWAN_SUPABASE_CONFIG || {};
      function status(message, kind = "info") { msg.textContent = message; msg.dataset.kind = kind; }
      if (!config.supabaseUrl || !config.supabaseAnonKey || !window.supabase) {
        requestForm.hidden = true;
        status("Sistem belum dapat disambungkan. Hubungi pentadbir Kawan CBT.", "danger");
        return;
      }
      // Implicit recovery is handled entirely on this page. Session is kept in
      // memory only; it is not persisted on shared school computers.
      const client = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey, {
        auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: true, flowType: "implicit" }
      });
      const hashParams = new URLSearchParams(window.location.hash.slice(1));
      const queryParams = new URLSearchParams(window.location.search);
      const arrivedViaRecovery = hashParams.get("type") === "recovery" || queryParams.get("type") === "recovery";
      const recoveryError = hashParams.get("error_code") || queryParams.get("error_code") || hashParams.get("error") || queryParams.get("error");
      let canSetPassword = false;

      function showRecovery() {
        if (canSetPassword) return;
        canSetPassword = true;
        requestForm.hidden = true;
        changeForm.hidden = false;
        intro.textContent = "Pautan telah disahkan. Sila cipta kata laluan baharu untuk akaun GBK anda.";
        status("Pautan sah. Kata laluan baharu mesti mengandungi sekurang-kurangnya 12 aksara.", "success");
        // Do not leave access tokens in the visible address bar/history.
        window.history.replaceState(null, "", window.location.pathname);
        byId("newPassword").focus();
      }
      client.auth.onAuthStateChange((event, session) => {
        if ((event === "PASSWORD_RECOVERY" || (event === "INITIAL_SESSION" && arrivedViaRecovery)) && session) {
          showRecovery();
        }
      });

      if (recoveryError) {
        status("Pautan reset tidak sah atau telah tamat tempoh. Hantar permintaan baharu.", "danger");
        window.history.replaceState(null, "", window.location.pathname);
      } else if (arrivedViaRecovery) {
        requestForm.hidden = true;
        intro.textContent = "Sedang mengesahkan pautan reset…";
        status("Sila tunggu sebentar.");
        // An expired link must not silently unlock password update.
        window.setTimeout(() => {
          if (!canSetPassword) {
            requestForm.hidden = false;
            intro.textContent = "Pautan belum dapat disahkan. Mohon pautan reset baharu.";
            status("Pautan tidak sah, telah tamat tempoh, atau gagal disahkan.", "danger");
            window.history.replaceState(null, "", window.location.pathname);
          }
        }, 7000);
      }

      requestForm.addEventListener("submit", async event => {
        event.preventDefault();
        const email = byId("email").value.trim();
        if (!email) return;
        byId("sendBtn").disabled = true;
        status("Sedang menghantar permintaan…");
        try {
          const redirectTo = window.location.origin + window.location.pathname;
          const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo });
          if (error) throw error;
          status("Jika emel ini didaftarkan, pautan reset akan dihantar. Periksa Inbox dan Spam. Gunakan emel terbaru sahaja.", "success");
        } catch (error) {
          status("Permintaan tidak berjaya. Cuba lagi kemudian atau semak had penghantaran emel Supabase.", "danger");
        } finally {
          byId("sendBtn").disabled = false;
        }
      });

      changeForm.addEventListener("submit", async event => {
        event.preventDefault();
        if (!canSetPassword) return status("Pautan belum disahkan. Minta pautan baharu.", "danger");
        const password = byId("newPassword").value;
        const confirmation = byId("confirmPassword").value;
        if (password.length < 12) return status("Gunakan sekurang-kurangnya 12 aksara.", "danger");
        if (password !== confirmation) return status("Dua kata laluan tidak sama.", "danger");
        byId("changeBtn").disabled = true;
        status("Sedang menyimpan kata laluan…");
        try {
          const { error } = await client.auth.updateUser({ password });
          if (error) throw error;
          byId("newPassword").value = "";
          byId("confirmPassword").value = "";
          canSetPassword = false;
          changeForm.hidden = true;
          intro.textContent = "Kata laluan berjaya dikemas kini. Anda boleh kembali ke Kawan CBT dan log masuk melalui Rekod.";
          status("Kata laluan telah berjaya ditukar. Sila log masuk semula.", "success");
          try { await client.auth.signOut(); } catch (_) { /* session kept only in memory */ }
        } catch (error) {
          status("Tidak dapat menukar kata laluan. Pautan mungkin tamat tempoh atau kata laluan tidak memenuhi dasar keselamatan. Cuba pautan baharu.", "danger");
        } finally {
          byId("changeBtn").disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
